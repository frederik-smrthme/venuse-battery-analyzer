name: "Marstek Battery Analyzer"
description: "Local LFP top-charge and balancing cycle analyzer for Home Assistant"
version: "0.1.1"
slug: "marstek_battery_analyzer"
url: "https://github.com/frederik-smrthme/venuse-battery-analyzer"
startup: application
boot: auto
init: false
arch:
  - aarch64
  - amd64
homeassistant_api: true
ports:
  "8099/tcp": 8099
ports_description:
  "8099/tcp": "Analyzer read-only REST API"
options:
  observation_soc: 97.0
  intensive_soc: 99.0
  intensive_vmax: 3.45
  charge_zero_current_a: 0.15
  charge_zero_power_w: 15.0
  charge_stop_stable_seconds: 30
  rest_reference_seconds: 60
  cycle_end_below_soc: 96.5
  post_charge_observation_minutes: 240
  max_cycle_hours: 24
  sample_interval_seconds: 5
  cell_voltage_min_v: 1.5
  cell_voltage_max_v: 3.8
  pack_voltage_tolerance_v: 0.75
  battery_cell_count: 16
  battery_nominal_voltage_v: 51.2
  battery_capacity_ah: 100.0
  battery_gross_capacity_kwh: 5.12
  battery_dod_percent: 88.0
  dc_power_charge_sign: "positive"
  dc_current_charge_sign: "positive"
  ac_power_charge_sign: "negative"
  ac_current_charge_sign: "negative"
  entity_soc: "sensor.marstek_venus_1_battery_soc"
  entity_vmax: "sensor.marstek_venus_1_max_cell_voltage"
  entity_vmin: "sensor.marstek_venus_1_min_cell_voltage"
  entity_battery_voltage: "sensor.marstek_venus_1_battery_voltage"
  entity_dc_power: "sensor.marstek_venus_1_battery_power"
  entity_dc_current: "sensor.marstek_venus_1_battery_current"
  entity_ac_power: "sensor.marstek_venus_1_ac_power"
  entity_ac_current: "sensor.marstek_venus_1_ac_current"
  entity_battery_temperature: "sensor.marstek_venus_1_battery_temperature"
  entity_internal_temperature: "sensor.marstek_venus_1_internal_temperature"
  entity_balancing: "binary_sensor.marstek_venus_1_balancing_mode"
  cell_entities_csv: ""
schema:
  observation_soc: float(0,100)
  intensive_soc: float(0,100)
  intensive_vmax: float(2.0,3.8)
  charge_zero_current_a: float(0,10)
  charge_zero_power_w: float(0,500)
  charge_stop_stable_seconds: int(1,600)
  rest_reference_seconds: int(10,600)
  cycle_end_below_soc: float(0,100)
  post_charge_observation_minutes: int(5,1440)
  max_cycle_hours: int(1,168)
  sample_interval_seconds: int(1,60)
  cell_voltage_min_v: float(0.5,3.5)
  cell_voltage_max_v: float(3.3,4.2)
  pack_voltage_tolerance_v: float(0,5)
  battery_cell_count: int(1,64)
  battery_nominal_voltage_v: float(1,1000)
  battery_capacity_ah: float(1,10000)
  battery_gross_capacity_kwh: float(0.1,1000)
  battery_dod_percent: float(1,100)
  dc_power_charge_sign: list(positive|negative)
  dc_current_charge_sign: list(positive|negative)
  ac_power_charge_sign: list(positive|negative)
  ac_current_charge_sign: list(positive|negative)
  entity_soc: str
  entity_vmax: str
  entity_vmin: str
  entity_battery_voltage: str
  entity_dc_power: str
  entity_dc_current: str
  entity_ac_power: str
  entity_ac_current: str
  entity_battery_temperature: str
  entity_internal_temperature: str
  entity_balancing: str
  cell_entities_csv: str
